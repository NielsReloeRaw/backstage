apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: new-service
  title: Nieuwe service
  description: Maakt een nieuwe GitHub repository aan en registreert de service in de Backstage catalog.
  tags:
    - service
    - github
spec:
  owner: guests
  type: service

  parameters:
    - title: Service informatie
      required:
        - name
        - description
        - owner
      properties:
        name:
          title: Naam
          type: string
          description: Naam van de service (lowercase, kebab-case, bijv. payment-service)
          pattern: '^[a-z0-9-]+$'
          ui:autofocus: true
        description:
          title: Omschrijving
          type: string
          description: Korte beschrijving van wat de service doet
        owner:
          title: Team
          type: string
          description: Het team dat eigenaar is van deze service
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group
        lifecycle:
          title: Lifecycle
          type: string
          description: Huidige fase van de service
          default: development
          enum:
            - development
            - production
            - deprecated

    - title: GitHub repository
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository locatie
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
            allowedOwners:
              - nielsreloeraw

  steps:
    - id: fetch
      name: Genereer bestanden vanuit skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          lifecycle: ${{ parameters.lifecycle }}

    - id: publish
      name: Publiceer naar GitHub
      action: publish:github
      input:
        allowedHosts:
          - github.com
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main
        repoVisibility: private

    - id: register
      name: Registreer in Backstage catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: GitHub Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Bekijk in Backstage
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}

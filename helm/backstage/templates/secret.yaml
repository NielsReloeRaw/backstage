apiVersion: v1
kind: Secret
metadata:
  name: {{ include "backstage.fullname" . }}
  labels:
    {{- include "backstage.labels" . | nindent 4 }}
type: Opaque
stringData:
  GITHUB_TOKEN: {{ .Values.secret.githubToken | quote }}
  AUTH_GITHUB_CLIENT_ID: {{ .Values.secret.authGithubClientId | quote }}
  AUTH_GITHUB_CLIENT_SECRET: {{ .Values.secret.authGithubClientSecret | quote }}
